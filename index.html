<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Trắc Nghiệm Hồi Sức Cấp Cứu (HSCC)</title>
    <style>
        :root {
            --primary: #0056b3;
            --primary-hover: #004085;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --correct: #28a745;
            --correct-bg: #d4edda;
            --incorrect: #dc3545;
            --incorrect-bg: #f8d7da;
            --border: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 850px;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin: 0;
        }

        .controls-top {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .jump-container {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }

        .jump-container input {
            width: 50px;
            padding: 5px;
            border: 1px solid var(--border);
            border-radius: 4px;
            text-align: center;
            font-size: 0.9rem;
        }

        .question-card {
            margin-bottom: 20px;
        }

        .question-meta {
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 18px;
            color: #1a252f;
            white-space: pre-line;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-item {
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 0.98rem;
            transition: all 0.2s ease;
            background-color: #fff;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.4;
        }

        .option-item:hover:not(.disabled) {
            border-color: var(--primary);
            background-color: #f0f7ff;
        }

        .option-item.correct {
            border-color: var(--correct);
            background-color: var(--correct-bg);
            color: #155724;
            font-weight: 600;
        }

        .option-item.incorrect {
            border-color: var(--incorrect);
            background-color: var(--incorrect-bg);
            color: #721c24;
            animation: shake 0.3s ease-in-out;
        }

        .option-item.disabled {
            cursor: default;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            display: none;
            line-height: 1.4;
        }

        .alert-box.incorrect-alert {
            display: block;
            background-color: var(--incorrect-bg);
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .explanation-box {
            display: none;
            background-color: #e9ecef;
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 4px;
            margin-top: 15px;
            font-style: italic;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #333;
        }

        .explanation-box.show {
            display: block;
        }

        .explanation-title {
            font-weight: 700;
            font-style: normal;
            margin-bottom: 5px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid var(--border);
            padding-top: 15px;
            margin-top: auto;
        }

        .progress-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: #555;
        }

        @media (max-width: 600px) {
            .quiz-container { padding: 15px; }
            .header { flex-direction: column; align-items: flex-start; }
            .controls-top { width: 100%; justify-content: space-between; }
            .footer-nav { flex-direction: column; gap: 12px; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h1 class="title">Ôn Tập Hồi Sức Cấp Cứu</h1>
        <div class="controls-top">
            <button class="btn btn-secondary" onclick="shuffleQuestions()">🔀 Trộn câu hỏi</button>
            <div class="jump-container">
                <span>Câu:</span>
                <input type="number" id="jumpInput" min="1" onchange="jumpToQuestion()">
            </div>
        </div>
    </div>

    <div class="question-card">
        <div class="question-meta" id="questionMeta">Câu 1 / 0</div>
        <div class="question-text" id="questionText">Đang tải dữ liệu...</div>
        
        <div class="options-list" id="optionsContainer"></div>

        <div class="alert-box" id="alertBox"></div>

        <div class="explanation-box" id="explanationBox">
            <div class="explanation-title">💡 Diễn giải chi tiết:</div>
            <div id="explanationText"></div>
        </div>
    </div>

    <div class="footer-nav">
        <button class="btn" id="prevBtn" onclick="prevQuestion()">◄ Câu trước</button>
        <span class="progress-text" id="progressText">0%</span>
        <button class="btn" id="nextBtn" onclick="nextQuestion()">Câu tiếp ►</button>
    </div>
</div>

<script>
// KHỞI TẠO MẢNG CƠ SỞ DỮ LIỆU CÂU HỎI
let questionsDatabase = [
    // --- BẮT ĐẦU PHẦN 1 (CÂU 1 - 25) ---
    {
        id: 1,
        source: "LS HSCC CK1 2026 Đề 02 - Case 1.1",
        question: "Một người đàn ông 58 tuổi đột ngột ngã quỵ khi đang chơi thể thao tại công viên. Một bác sĩ đi ngang qua phát hiện bệnh nhân bất tỉnh, không thở, không bắt được mạch cảnh. AED được mang đến sau 2 phút, khử rung được thực hiện ngay.\n\nTheo hướng dẫn của AHA, yếu tố nào sau đây có liên quan chặt chẽ nhất với khả năng sống sót sau ngừng tim ngoài bệnh viện?",
        options: [
            "A. Thời gian vận chuyển đến bệnh viện < 10 phút",
            "B. Thực hiện sốc điện trong vòng 5 phút",
            "C. Sử dụng adrenaline trong vòng 3 phút đầu",
            "D. Đặt nội khí quản sớm tại hiện trường"
        ],
        correct: 1, // B
        explanation: "Đáp án B. Khuyến cáo của Hiệp hội Tim mạch Hoa Kỳ (AHA) nhấn mạnh mạnh mẽ rằng, đối với các trường hợp ngừng tuần hoàn ngoại viện có nhịp rung thất hoặc nhanh thất, việc tiếp cận bệnh nhân và thực hiện sốc điện phá rung sớm (đặc biệt trong vòng 3 đến 5 phút đầu tiên) là yếu tố độc lập mang tính quyết định sống còn cao nhất."
    },
    {
        id: 2,
        source: "LS HSCC CK1 2026 Đề 02 - Case 1.2",
        question: "Nếu người làm CPR tại hiện trường chỉ được huấn luyện cơ bản và không có phương tiện bảo hộ đường thở, hướng dẫn hiện hành khuyến cáo:",
        options: [
            "A. Dừng cấp cứu",
            "B. Chỉ ép tim liên tục, không thổi ngạt",
            "C. Vẫn ép tim kết hợp thổi ngạt theo chu kỳ 30:2",
            "D. Chờ nhân viên y tế đến"
        ],
        correct: 1, // B
        explanation: "Đáp án B. Để giảm thiểu rào cản tâm lý e ngại lây nhiễm bệnh và tránh làm gián đoạn việc ép tim bởi những người không thuần thục kỹ năng thổi ngạt, AHA khuyến cáo người cứu hộ không chuyên hoặc không có dụng cụ bảo hộ chỉ cần thực hiện ép tim liên tục tay không (Hands-only CPR)."
    },
    {
        id: 3,
        source: "LS HSCC CK1 2026 Đề 02 - Case 1.3",
        question: "Người bệnh được sốc điện sau 3 phút và phục hồi tuần hoàn tự phát (ROSC). Khi EMS đến, bệnh nhân còn lơ mơ, thở nông, huyết áp 98/60 mmHg, SpO2 87% với oxy gọng mũi. Chiến lược xử trí thích hợp là:",
        options: [
            "A. Thở oxy gọng mũi liều cao",
            "B. Tạm theo dõi, không can thiệp thêm",
            "C. Đặt nội khí quản sớm, vận chuyển đến ICU",
            "D. Bắt đầu hạ thân nhiệt tích cực tại chỗ"
        ],
        correct: 2, // C
        explanation: "Đáp án C. Bệnh nhân sau khi có mạch trở lại nhưng tri giác lơ mơ và tụt huyết áp, suy hô hấp không đáp ứng với oxy gọng kính, chứng tỏ chức năng hô hấp và khả năng bảo vệ đường thở không đảm bảo. Đặt nội khí quản là can thiệp thiết yếu ngay lúc này."
    },
    {
        id: 4,
        source: "LS HSCC CK1 2026 Đề 02 - Case 2.1",
        question: "Bệnh nhân nam 81 tuổi, tiền sử tăng huyết áp điều trị không thường xuyên, vào viện vì đột quỵ chảy máu não. Khám: GCS 12 điểm, HA: 160/90 mmHg, TST: 90 ck/ph.\n\nĐiều trị nào sau đây có thể hạn chế tăng thể tích khối máu tụ?",
        options: [
            "A. Manitol",
            "B. Kiểm soát huyết áp tâm thu dưới 180 mmHg",
            "C. Mổ sọ lấy máu tụ",
            "D. Dùng các thuốc cầm máu"
        ],
        correct: 1, // B
        explanation: "Đáp án B. Đối với xuất huyết phát, kiểm soát huyết áp nội khoa tích cực (thường < 140-180 mmHg tùy phác đồ) là biện pháp cốt lõi để ngăn khối máu tụ tiếp tục lan rộng."
    },
    {
        id: 5,
        source: "LS HSCC CK1 2026 Đề 02 - Case 2.2",
        question: "Sau 24h điều trị tại khoa cấp cứu, ý thức của bệnh nhân xấu đi, khám GCS: 7 điểm. Bệnh nhân được chụp lại phim CT sọ não có thể tích khối máu tụ tăng lên so với phim cũ, có nhiều máu trong não thất bên và thất 3, có giãn não thất cấp. Biện pháp điều trị nào sau đây phù hợp với bệnh nhân:",
        options: [
            "A. Mở sọ giảm áp",
            "B. Dẫn lưu脑thất/não thất ra ngoài",
            "C. Dùng mannitol",
            "D. Dùng thuốc cầm máu"
        ],
        correct: 1, // B
        explanation: "Đáp án B. Biến chứng máu tràn脑thất/não thất gây giãn脑thất/não thất cấp là một cấp cứu ngoại khoa thần kinh, chỉ định ưu tiên lúc này là chọc dẫn lưu dịch脑tủy/não tủy ra ngoài (EVD) để giải áp lực nội sọ cấp tính."
    },
    {
        id: 6,
        source: "LS HSCC CK1 2026 Đề 02 - Case 3.1",
        question: "Bệnh nhân nam 79 tuổi, tiền sử tăng huyết áp, đái tháo đường type 2 điều trị đều. Trước vào viện 2h bệnh nhân đột ngột xuất hiện yếu nửa người phải. Khám: GCS 14 đ, liệt 1/2 người P, cơ lực 3/5, HA: 190/120 mmHg, TST: 110 ck/ph, SpO2: 97%. Glucose: 15 mmol/L; kết quả chụp CT sọ não của BN bình thường. Bệnh nhân được chẩn đoán: Đột quỵ nhồi máu não giờ thứ 2.5 NIHSS 8 điểm và được chỉ định dùng thuốc tiêu sợi huyết.\n\nMục tiêu kiểm soát huyết áp ở bệnh nhân này trước khi tiêu sợi huyết là:",
        options: [
            "A. Huyết áp tâm thu < 185 mmHg và huyết áp tâm trương < 110 mmHg",
            "B. Huyết áp tâm thu < 170 mmHg và huyết áp tâm trương < 120 mmHg",
            "C. Huyết áp tâm thu < 160 mmHg và huyết áp tâm trương < 110 mmHg",
            "D. Huyết áp tâm thu < 140 mmHg và huyết áp tâm trương < 90 mmHg"
        ],
        correct: 0, // A
        explanation: "Đáp án A. Theo hướng dẫn điều trị đột quỵ của Hiệp hội Đột quỵ Hoa Kỳ, huyết áp phải được hạ một cách thận trọng và duy trì dưới 185/110 mmHg trước khi bắt đầu truyền thuốc tiêu sợi huyết để giảm thiểu rủi ro biến chứng xuất huyết chuyển dạng."
    },
    {
        id: 7,
        source: "LS HSCC CK1 2026 Đề 02 - Case 3.2",
        question: "Hoạt chất nào sau đây được sử dụng để kiểm soát cơn tăng huyết áp ở BN này:",
        options: [
            "A. Furosemid",
            "B. Nicardipine",
            "C. Atenolol",
            "D. Valsartan"
        ],
        correct: 1, // B
        explanation: "Đáp án B. Trong cấp cứu đột quỵ, Nicardipin truyền tĩnh mạch liên tục là thuốc chẹn kênh canxi được ưu tiên sử dụng do khả năng kiểm soát huyết áp nhanh chóng, trơn tru và dễ chuẩn độ liều."
    },
    {
        id: 8,
        source: "LS HSCC CK1 2026 Đề 02 - Case 3.3",
        question: "Thuốc hạ huyết áp đường uống khi nào được sử dụng lại ở bệnh nhân này:",
        options: [
            "A. Sau 24 đến 72h",
            "B. Sau 72h",
            "C. Ngay sau khi tiêu sợi huyết",
            "D. Ngay sau khi kết thúc dùng thuốc hạ huyết áp đường tĩnh mạch"
        ],
        correct: 0, // A
        explanation: "Đáp án A. Khuyến cáo quốc tế cấm tuyệt đối việc sử dụng bất kỳ thuốc chống huyết khối hay thuốc đường uống nào trong vòng 24 giờ sau khi truyền tiêu sợi huyết để ngăn ngừa chảy máu ồ ạt."
    },
    {
        id: 9,
        source: "LS HSCC CK1 2026 Đề 02 - Case 5.1",
        question: "Bệnh nhân nữ 52 tuổi vào viện vì rối loạn ý thức. Khám: Glasgow 12, M 120 ck/ph, Huyết áp 120/70 mmHg, da niêm mạc khô, không có dấu hiệu thần kinh khu trú. Na 128 mmol/L; K+ 4.5 mmol/L; Cl- 94 mmol/L; glucose 45 mmol/L.\n\nHôn mê ở bệnh nhân này có thể do những nguyên nhân sau, TRỪ:",
        options: [
            "A. Đột quỵ brain/não cấp",
            "B. Hạ natri máu",
            "C. Hôn mê do tăng áp lực thẩm thấu",
            "D. Hôn mê do nhiễm toan ceton"
        ],
        correct: 0, // A
        explanation: "Đáp án A. Dấu hiệu lâm sàng không có dấu hiệu thần kinh khu trú giúp loại trừ bước đầu chẩn đoán đột quỵ brain/não cấp gây tổn thương khu trú. Các nguyên nhân chuyển hóa như hạ Natri máu, tăng áp lực thẩm thấu hay nhiễm toan ceton đều trực tiếp gây giảm ý thức và hôn mê."
    },
    {
        id: 10,
        source: "LS HSCC CK1 2026 Đề 02 - Case 5.2",
        question: "Biện pháp điều chỉnh natri máu phù hợp nhất ở bệnh nhân này là:",
        options: [
            "A. Hạn chế dịch và lợi tiểu quai",
            "B. Truyền dung dịch natriclorua ưu trương",
            "C. Truyền dung dịch natriclorua đẳng trương và insulin",
            "D. Cho bệnh nhân uống demeclocycline"
        ],
        correct: 2, // C
        explanation: "Đáp án C. Hạ natri máu trong bối cảnh đường huyết cao ngất ngưởng là hạ natri nhược trương giả tạo do glucose kéo nước ra ngoại bào làm pha loãng natri; phương pháp điều trị chuẩn là bù dịch bằng dung dịch muối đẳng trương kết hợp truyền Insulin tĩnh mạch để kiểm soát đường huyết, khi đó nồng độ natri máu sẽ tự động điều chỉnh."
    },
    {
        id: 11,
        source: "LS HSCC CK1 2026 Đề 02 - Case 6.1",
        question: "Bệnh nhân nữ, 62 tuổi, vào viện vì đau hạ sườn phải một ngày nay, kèm sốt 39-40 độ C, tiền sử sỏi đường mật đã mổ 3 lần cách đây 2 năm. Khám thấy BN ý thức lơ mơ, GCS 10đ, M 140 l/p, HA 70/30 mmHg, SpO2 khó đo, da tái lạnh nổi vân tím tái.\n\nXử trí cần đặt ra là ưu tiên số 1 cho bệnh nhân này là gì?",
        options: [
            "A. Kiểm soát hỗ trợ đường thở",
            "B. Lấy đường truyền + dịch truyền",
            "C. Đầu bằng, thở oxy",
            "D. Kháng sinh"
        ],
        correct: 1, // B
        explanation: "Đáp án B. Bệnh nhân có sốc nhiễm khuẩn rõ. Bước cơ học đầu tiên trong gói 1 giờ hồi sức sốc nhiễm khuẩn là truyền nhanh dịch tinh thể với liều 30ml/kg để bồi phụ thể tích tuần hoàn."
    },
    {
        id: 12,
        source: "LS HSCC CK1 2026 Đề 02 - Case 6.2",
        question: "Xử trí truyền dịch cho bệnh nhân mà huyết áp không cải thiện, có thể dùng thêm 1 vận mạch sau TRỪ:",
        options: [
            "A. Adrenalin",
            "B. Noradrenalin",
            "C. Dopamin",
            "D. Dobutamin"
        ],
        correct: 3, // D
        explanation: "Đáp án D. Dobutamin là thuốc tăng co bóp cơ tim nhưng gây giãn mạch ngoại vi, do đó chống chỉ định dùng đơn độc khi huyết áp đang tụt sâu trong sốc nhiễm khuẩn."
    },
    {

// --- HÀM KHỞI TẠO VÀ XỬ LÝ SỰ KIỆN CỦA ỨNG DỤNG ---
let currentIndex = 0;
let userAnswers = {};

function loadQuestion(index) {
    if (questionsDatabase.length === 0) return;

    const q = questionsDatabase[index];
    document.getElementById('questionMeta').innerText = `CÂU ${index + 1} / ${questionsDatabase.length} - [${q.source}]`;
    document.getElementById('questionText').innerText = q.question;

    const optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = '';

    const alertBox = document.getElementById('alertBox');
    alertBox.className = 'alert-box';
    alertBox.innerText = '';

    const explanationBox = document.getElementById('explanationBox');
    explanationBox.classList.remove('show');
    document.getElementById('explanationText').innerText = '';

    q.options.forEach((optText, optIdx) => {
        const btn = document.createElement('div');
        btn.className = 'option-item';
        btn.innerText = optText;

        if (userAnswers[index] !== undefined) {
            btn.classList.add('disabled');
            if (optIdx === q.correct) {
                btn.classList.add('correct');
            }
            if (userAnswers[index] === optIdx && optIdx !== q.correct) {
                btn.classList.add('incorrect');
            }
        } else {
            btn.onclick = () => selectOption(index, optIdx);
        }

        optionsContainer.appendChild(btn);
    });

    if (userAnswers[index] !== undefined) {
        if (userAnswers[index] === q.correct) {
            showExplanation(q.explanation);
        } else {
            alertBox.innerText = "❌ Đáp án chưa chính xác. Vui lòng chọn lại câu hỏi này khi ôn luyện!";
            alertBox.classList.add('incorrect-alert');
        }
    }

    document.getElementById('prevBtn').disabled = (index === 0);
    document.getElementById('nextBtn').disabled = (index === questionsDatabase.length - 1);
    document.getElementById('jumpInput').value = index + 1;
    
    const progress = Math.round(((index + 1) / questionsDatabase.length) * 100);
    document.getElementById('progressText').innerText = `${progress}% Hoàn thành`;
}

function selectOption(qIndex, optIndex) {
    const q = questionsDatabase[qIndex];
    userAnswers[qIndex] = optIndex;

    const options = document.querySelectorAll('.option-item');
    
    if (optIndex === q.correct) {
        options[optIndex].classList.add('correct');
        options.forEach(opt => opt.classList.add('disabled'));
        document.getElementById('alertBox').className = 'alert-box';
        showExplanation(q.explanation);
    } else {
        options[optIndex].classList.add('incorrect');
        const alertBox = document.getElementById('alertBox');
        alertBox.innerText = "❌ Sai rồi! Bạn hãy suy nghĩ và chọn lại đáp án đúng nhé.";
        alertBox.classList.add('incorrect-alert');
        
        setTimeout(() => {
            options[optIndex].classList.remove('incorrect');
            delete userAnswers[qIndex];
        }, 1200);
    }
}

function showExplanation(text) {
    const explanationBox = document.getElementById('explanationBox');
    document.getElementById('explanationText').innerText = text;
    explanationBox.classList.add('show');
}

function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        loadQuestion(currentIndex);
    }
}

function nextQuestion() {
    if (currentIndex < questionsDatabase.length - 1) {
        currentIndex++;
        loadQuestion(currentIndex);
    }
}

function jumpToQuestion() {
    const val = parseInt(document.getElementById('jumpInput').value);
    if (val >= 1 && val <= questionsDatabase.length) {
        currentIndex = val - 1;
        loadQuestion(currentIndex);
    }
}

function shuffleQuestions() {
    for (let i = questionsDatabase.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [questionsDatabase[i], questionsDatabase[j]] = [questionsDatabase[j], questionsDatabase[i]];
    }
    userAnswers = {};
    currentIndex = 0;
    loadQuestion(0);
    alert("🔀 Đã trộn toàn bộ câu hỏi thành công!");
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') prevQuestion();
    if (e.key === 'ArrowRight') nextQuestion();
});

window.onload = () => {
    loadQuestion(0);
};
</script>
